<svg xmlns="http://www.w3.org/2000/svg" width="900" height="286" viewBox="0 0 900 286" role="img" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#666666"><rect width="900" height="286" rx="16" fill="#F6F6F6"/><title>Ärimõisted</title><path d="M0 16 A16 16 0 0 1 16 0 H884 A16 16 0 0 1 900 16 V48 H0 Z" fill="#E9F0E9"/><text x="20" y="29.0" font-size="14" font-weight="700" letter-spacing="0.3">Mõiste</text><text x="290.0" y="29.0" font-size="14" font-weight="700" letter-spacing="0.3">Tähendus ärikeeles</text><text x="20" y="77" font-size="14" font-weight="700">Toode</text><text x="290.0" y="77" font-size="14" font-weight="400">Eraldi lähteandmete tootekirje; ühe toote eri pakendite käsitlus</text><line x1="20" x2="880" y1="96" y2="96" stroke="#E9F0E9" stroke-width="2"/><text x="20" y="125" font-size="14" font-weight="700">Võrreldav toitaineväärtus</text><text x="290.0" y="125" font-size="14" font-weight="400">Sama toitaine kogus samas ühikus ja samal alusel, näiteks mg ühe kg</text><text x="290.0" y="145" font-size="14" font-weight="400">müüdava sööda kohta</text><line x1="20" x2="880" y1="164" y2="164" stroke="#E9F0E9" stroke-width="2"/><text x="20" y="193" font-size="14" font-weight="700">Puuduv väärtus</text><text x="290.0" y="193" font-size="14" font-weight="400">Kogus pole teada. See ei tähenda nullsisaldust</text><line x1="20" x2="880" y1="212" y2="212" stroke="#E9F0E9" stroke-width="2"/><text x="20" y="241" font-size="14" font-weight="700">Kontrollimist vajav kirje</text><text x="290.0" y="241" font-size="14" font-weight="400">Kirje, mille kohta kontroll leidis ebaselguse; leid ei kinnita</text><text x="290.0" y="261" font-size="14" font-weight="400">automaatselt viga</text></svg>