<svg xmlns="http://www.w3.org/2000/svg" width="900" height="374" viewBox="0 0 900 374" role="img" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#666666"><rect width="900" height="374" rx="16" fill="#F6F6F6"/><title>Kvaliteedisildid (flags)</title><path d="M0 16 A16 16 0 0 1 16 0 H884 A16 16 0 0 1 900 16 V48 H0 Z" fill="#E9F0E9"/><text x="20" y="29.0" font-size="14" font-weight="700" letter-spacing="0.3">Silt</text><text x="290.0" y="29.0" font-size="14" font-weight="700" letter-spacing="0.3">Tähendus</text><text x="20" y="77" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">INVALID_VALUE</text><text x="290.0" y="77" font-size="14" font-weight="400">Algne väärtus sisaldas teksti või sümboleid, mida ei saanud numbriks</text><text x="290.0" y="97" font-size="14" font-weight="400">teisendada</text><line x1="20" x2="880" y1="116" y2="116" stroke="#E9F0E9" stroke-width="2"/><text x="20" y="145" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">WRONG_UNIT</text><text x="290.0" y="145" font-size="14" font-weight="400">Väärtus on numbriline, kuid selle ühik ei vasta oodatud baasühikule (nt</text><text x="290.0" y="165" font-size="14" font-weight="400">oodati milligramme, aga sisestati grammid)</text><line x1="20" x2="880" y1="184" y2="184" stroke="#E9F0E9" stroke-width="2"/><text x="20" y="213" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">NEGATIVE_VALUE</text><text x="290.0" y="213" font-size="14" font-weight="400">Väärtus on negatiivne, mis on toitainete sisalduses võimatu</text><line x1="20" x2="880" y1="232" y2="232" stroke="#E9F0E9" stroke-width="2"/><text x="20" y="261" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">LOW_OUTLIER</text><text x="290.0" y="261" font-size="14" font-weight="400">Väärtus on statistiliselt ebatavaliselt madal (jääb allapoole IQR</text><text x="290.0" y="281" font-size="14" font-weight="400">alumist piiri: Q1 − 1,5 × IQR)</text><line x1="20" x2="880" y1="300" y2="300" stroke="#E9F0E9" stroke-width="2"/><text x="20" y="329" font-size="13" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">HIGH_OUTLIER</text><text x="290.0" y="329" font-size="14" font-weight="400">Väärtus on statistiliselt ebatavaliselt kõrge (jääb ülespoole IQR</text><text x="290.0" y="349" font-size="14" font-weight="400">ülemist piiri: Q3 + 1,5 × IQR)</text></svg>