<svg xmlns="http://www.w3.org/2000/svg" width="900" height="346" viewBox="0 0 900 346" role="img" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#666666"><rect width="900" height="346" rx="16" fill="#F6F6F6"/><title>Uurimisküsimused</title><path d="M0 16 A16 16 0 0 1 16 0 H884 A16 16 0 0 1 900 16 V48 H0 Z" fill="#E9F0E9"/><text x="20" y="29.0" font-size="14" font-weight="700" letter-spacing="0.3">Kavandatav küsimus</text><text x="470.0" y="29.0" font-size="14" font-weight="700" letter-spacing="0.3">Kust vastus tuleb</text><text x="20" y="77" font-size="14" font-weight="700">Kuidas määrata loomale sobiv toitumine nii, et</text><text x="20" y="97" font-size="14" font-weight="700">vältida allergeene? (Põhiküsimus)</text><text x="470.0" y="77" font-size="14" font-weight="400">Võrdlusleht ja toitainete/koostisosade</text><text x="470.0" y="97" font-size="14" font-weight="400">dimensioonid (allergeenide ja toorainete allikate</text><text x="470.0" y="117" font-size="14" font-weight="400">filtreerimine)</text><line x1="20" x2="880" y1="136" y2="136" stroke="#E9F0E9" stroke-width="2"/><text x="20" y="165" font-size="14" font-weight="700">Kui palju tooteid on andmestikus ja millistesse</text><text x="20" y="185" font-size="14" font-weight="700">rühmadesse need kuuluvad?</text><text x="470.0" y="165" font-size="14" font-weight="400">Aruande ülevaateleht ja tootedimensioon</text><text x="470.0" y="185" font-size="14" font-weight="400">(dim_toode)</text><line x1="20" x2="880" y1="204" y2="204" stroke="#E9F0E9" stroke-width="2"/><text x="20" y="233" font-size="14" font-weight="700">Kuidas erinevad valitud toodete sama toitaine</text><text x="20" y="253" font-size="14" font-weight="700">sisaldused?</text><text x="470.0" y="233" font-size="14" font-weight="400">Võrdlusleht. Ühine mõõtühik ja võrdlusalus</text><line x1="20" x2="880" y1="272" y2="272" stroke="#E9F0E9" stroke-width="2"/><text x="20" y="301" font-size="14" font-weight="700">Millised kvaliteediprobleemid leiti ning millised</text><text x="20" y="321" font-size="14" font-weight="700">neist lahendati?</text><text x="470.0" y="301" font-size="14" font-weight="400">Kvaliteedileht ja kontrollide tulemused</text></svg>