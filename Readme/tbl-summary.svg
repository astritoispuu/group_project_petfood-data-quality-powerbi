<svg xmlns="http://www.w3.org/2000/svg" width="900" height="210" viewBox="0 0 900 210" role="img" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#666666" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect width="900" height="210" rx="16" fill="#F6F6F6"/><title>Uurimisküsimuste vastused</title><path d="M0 16 A16 16 0 0 1 16 0 H884 A16 16 0 0 1 900 16 V48 H0 Z" fill="#E9F0E9"/><text x="20" y="29.0" font-size="14" font-weight="700" letter-spacing="0.3">Uurimisküsimus</text><text x="380.0" y="29.0" font-size="14" font-weight="700" letter-spacing="0.3">Vastus ja tõend</text><text x="20" y="77" font-size="14" font-weight="700">1. Kuidas filtreerida välja sobiv</text><text x="20" y="97" font-size="14" font-weight="700">dieettoit allergeenideta?</text><text x="380.0" y="77" font-size="14" font-weight="400">Power BI „Välistamine“ lehe filtrite abil saab kiiresti</text><text x="380.0" y="97" font-size="14" font-weight="400">välistada soovimatud koostisosad ning „Toitainete võrdlus“</text><text x="380.0" y="117" font-size="14" font-weight="400">lehel jälgida toitainete taset mg/kg alusel</text><line x1="20" x2="880" y1="136" y2="136" stroke="#E9F0E9" stroke-width="2"/><text x="20" y="165" font-size="14" font-weight="700">2. Kuidas tagada andmete</text><text x="20" y="185" font-size="14" font-weight="700">usaldusväärsus?</text><text x="380.0" y="165" font-size="14" font-weight="400">Läbi PostgreSQL-i automatiseeritud auditite, veakontrollide</text><text x="380.0" y="185" font-size="14" font-weight="400">ja vet_clean standardiseeritud andmevoo</text></svg>